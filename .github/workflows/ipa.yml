name: build-ipa

# 不用 Xcode / xcodebuild：clang 直接交叉编译 + 手动打包 IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-14          # Apple Silicon, 自带 iOS SDK
    steps:
      - uses: actions/checkout@v4

      - name: Show SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          echo "SDK=$SDK" >> $GITHUB_ENV
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile (clang, no xcodebuild)
        run: |
          mkdir -p build
          clang -target arm64-apple-ios14.0 -isysroot "$SDK" \
                -fobjc-arc -fblocks -Os -w \
                -c ios/main.m -o build/main.o

      - name: Link (ld64 + adhoc)
        run: |
          ld -arch arm64 -platform_version ios 14.0 14.0 -syslibroot "$SDK" \
             -F"$SDK/System/Library/Frameworks" -o build/PluginTool build/main.o \
             -framework UIKit -framework Foundation -framework WebKit \
             -framework CoreGraphics -framework UniformTypeIdentifiers \
             "$SDK/usr/lib/libSystem.B.tbd"
          # 检查是否被 ld 自动 adhoc 签名，没有就补
          codesign -dv build/PluginTool 2>&1 | head -3 || true

      - name: Pack IPA (mode 755 on executable)
        run: |
          set -e
          APP=PluginTool
          rm -rf Payload dist; mkdir -p "Payload/$APP.app" dist
          cp build/$APP "Payload/$APP.app/$APP"
          cp ios/Info.plist ios/PkgInfo "Payload/$APP.app/"
          [ -d www ] && cp -R www "Payload/$APP.app/www"
          chmod 755 "Payload/$APP.app/$APP"
          find "Payload/$APP.app" -type d -exec chmod 755 {} \;
          find "Payload/$APP.app" -type f -exec chmod 644 {} \;
          chmod 755 "Payload/$APP.app/$APP"
          zip -qry "dist/$APP-unsigned.ipa" Payload
          unzip -Z -l "dist/$APP-unsigned.ipa" | grep -E "$APP$"
          test "$(unzip -Z -l dist/$APP-unsigned.ipa | grep -c '^-rwxr-xr-x.*PluginTool$')" -ge 1
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: PluginTool-unsigned
          path: dist/*.ipa
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
