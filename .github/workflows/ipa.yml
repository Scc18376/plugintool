name: build-ipa

# 不用 Xcode / xcodebuild：clang + ld 直接交叉编译，手动打包 IPA
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest          # Apple Silicon runner，自带 iOS SDK
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PluginTool
            src: ios/main.m
            plist: ios/Info.plist
            res: www
            fw: "-framework UIKit -framework Foundation -framework WebKit -framework CoreGraphics -framework UniformTypeIdentifiers"
          - name: TencentVideo
            src: tvapp/main.m
            plist: tvapp/Info.plist
            res: ""
            icons: tvapp/icons
            fw: "-framework UIKit -framework Foundation -framework WebKit -framework CoreGraphics -framework UniformTypeIdentifiers -framework AVKit -framework AVFoundation"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "sdk: $SDK"; xcrun --sdk iphoneos --show-sdk-version

      - name: Compile
        run: |
          mkdir -p build
          clang -target arm64-apple-ios14.0 -isysroot "$SDK" \
                -fobjc-arc -fblocks -Os -w \
                -c "${{ matrix.src }}" -o build/${{ matrix.name }}.o

      - name: Link
        run: |
          ld -arch arm64 -platform_version ios 14.0 14.0 -syslibroot "$SDK" \
             -F"$SDK/System/Library/Frameworks" \
             -o build/${{ matrix.name }} build/${{ matrix.name }}.o \
             ${{ matrix.fw }} \
             "$SDK/usr/lib/libSystem.B.tbd"

      - name: Ad-hoc sign (codesign, 不是 xcodebuild)
        run: codesign --force --sign - --timestamp=none build/${{ matrix.name }}

      - name: Pack IPA
        run: |
          set -e
          APP=${{ matrix.name }}
          rm -rf Payload dist; mkdir -p "Payload/$APP.app" dist
          cp "build/$APP" "Payload/$APP.app/$APP"
          cp "${{ matrix.plist }}" "Payload/$APP.app/Info.plist"
          printf 'APPL????' > "Payload/$APP.app/PkgInfo"
          if [ -n "${{ matrix.res }}" ]; then cp -R "${{ matrix.res }}" "Payload/$APP.app/www"; fi
          if [ -n "${{ matrix.icons }}" ]; then cp "${{ matrix.icons }}"/*.png "Payload/$APP.app/"; fi
          find "Payload/$APP.app" -type d -exec chmod 755 {} \;
          find "Payload/$APP.app" -type f -exec chmod 644 {} \;
          chmod 755 "Payload/$APP.app/$APP"
          zip -qry "dist/$APP-unsigned.ipa" Payload
          echo "--- 校验 ---"
          unzip -Z -l "dist/$APP-unsigned.ipa" | grep -E "(Payload/$APP.app/$APP$|Info.plist|PkgInfo)"
          if ! unzip -Z -l "dist/$APP-unsigned.ipa" | grep -q "^-rwxr-xr-x.*$APP$"; then
            echo "!! 可执行文件不是 755"; exit 1
          fi
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-ipa
          path: dist/*.ipa
          retention-days: 30


  release:
    needs: ipa
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect ipa
        run: |
          mkdir -p out
          find artifacts -name '*.ipa' -exec cp {} out/ \;
          ls -lh out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.ipa
          generate_release_notes: true
